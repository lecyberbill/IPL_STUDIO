name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Frequent commits on the same branch must not pile up: only the run for
# the LATEST commit executes. Any run still in progress when a new push
# arrives on the same ref is cancelled immediately (the newest commit wins).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Guarantee python/python3 on PATH so the python golden fixtures
      # actually execute instead of being skipped (node is pre-installed).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test

  lint:
    name: Lint (oxlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    name: Build (tsc + vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  bench:
    name: Bench smoke (mock, all specs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Node >= 23.6 strips types natively (the harness is a plain `node`
      # script importing .ts engine modules — no build step).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Python specs (typed-order, parking) execute `python main.py` in verify.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: node scripts/run-benchmark.ts --mode mock --quiet
